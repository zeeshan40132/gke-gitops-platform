apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-platform-app
  labels:
    app: gitops-platform-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-platform-app
  template:
    metadata:
      labels:
        app: gitops-platform-app
    spec:
      containers:
        - name: gitops-platform-app
          image: gitops-platform-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi