apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-platform
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/zeeshan40132/gke-gitops-platform.git
    targetRevision: master
    path: helm/gitops-platform

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
