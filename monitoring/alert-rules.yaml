
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gitops-platform-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: gitops-platform.rules
      rules:
        - alert: HighApplicationErrorRate
          expr: |
            (
              sum(rate(http_errors_total[5m]))
              /
              clamp_min(sum(rate(http_requests_total[5m])), 0.001)
            ) > 0.10
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: High application error rate
            description: More than 10% of application requests are failing.

        - alert: HighApplicationLatency
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket[5m]))
            ) > 0.5
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: High application request latency
            description: The 95th percentile request latency is above 500ms.

        - alert: ApplicationReplicasUnavailable
          expr: |
            kube_deployment_status_replicas_available{
              namespace="default",
              deployment="gitops-platform-app"
            } < 2
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Application replica unavailable
            description: Fewer than two application replicas are available.
