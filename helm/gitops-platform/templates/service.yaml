apiVersion: v1
kind: Service
metadata:
  name: {{ include "gitops-platform.fullname" . }}-service
  labels:
    {{- include "gitops-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: gitops-platform-app
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}