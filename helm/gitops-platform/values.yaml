replicaCount: 2

image:
  repository: gitops-platform-app
  tag: "1.0.0"
  pullPolicy: IfNotPresent

containerPort: 8000

service:
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 30080

probes:
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10

  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 20

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

revisionHistoryLimit: 3